version: '3.8'

services:
  # База данных для пользователей и метаданных файлов
  postgres:
    image: postgres:15-alpine
    container_name: ai_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: transcription_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_network
    restart: unless-stopped

  # Кэш для сессий, токенов и быстрого доступа (Redis)
  redis:
    image: redis:7-alpine
    container_name: ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_network
    restart: unless-stopped

  # Брокер сообщений для асинхронных задач (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ai_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Порт для общения сервисов
      - "15672:15672" # Веб-интерфейс RabbitMQ (логин: guest, пароль: guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ai_network
    restart: unless-stopped

  # --- ПЛЕЙСХОЛДЕРЫ ДЛЯ НАШИХ СЕРВИСОВ (будем добавлять по мере написания) ---
  
  api-gateway:
    build:
      context: ./api-gateway
    container_name: ai_api_gateway
    env_file:
      - .env
    environment:
      - PORT=3000
      - USER_SERVICE_URL=http://user-service:3001
      - UPLOAD_SERVICE_URL=http://upload-service:3002
      - SEARCH_SERVICE_URL=http://search-service:3003
      - MINDMAP_SERVICE_URL=http://mindmap-service:3005
      - JWT_SECRET=super_secret_jwt_key
    networks:
      - ai_network
    depends_on:
      - redis
  user-service:
    build:
      context: ./services/user-service
    container_name: ai_user_service
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=transcription_db
      - POSTGRES_HOST=postgres
      - JWT_SECRET=super_secret_jwt_key
    networks:
      - ai_network
    depends_on:
      - postgres
  upload-service:
    build:
      context: ./services/upload-service
    container_name: ai_upload_service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=transcription_db
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_SECRET=super_secret_jwt_key
    networks:
      - ai_network
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - media_uploads:/usr/src/app/uploads
  
  ai-processing-service:
    build:
      context: ./services/ai-processing-service
    container_name: ai_python_worker
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=transcription_db
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    env_file:
      - .env  
    deploy:
          resources:
            reservations:
              devices:
                - driver: nvidia
                  count: all
                  capabilities: [gpu]
    networks:
      - ai_network
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped
    volumes:
      # Важно: монтируем ту же папку, что и upload-service!
      - media_uploads:/usr/src/app/uploads


  search-service:
    build:
      context: ./services/search-service
    container_name: ai_search_service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=transcription_db
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key
    networks:
      - ai_network
    depends_on:
      - postgres
      - redis

  mindmap-service:
    build:
      context: ./services/mindmap-service
    container_name: ai_mindmap_service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DB_FILE_PATH=/app/data/mindmaps_db.json
    volumes:
      - mindmap_data:/app/data
    networks:
      - ai_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai_frontend
    ports:
      - "8000:8000"
    networks:
      - ai_network
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  media_uploads: # Общее хранилище для загруженных файлов
  mindmap_data:

networks:
  ai_network:
    driver: bridge